# ============================================================================
# HOGOPLUS-FS backend — AWS Mumbai (ap-south-1) EC2.
# Same code + same Neon DB + same Upstash Redis as the Emergent deployment.
#   docker compose up -d --build
# The container is published ONLY on localhost:8001; nginx (host) terminates TLS
# on 443 and reverse-proxies to it. See setup_server.sh + MUMBAI_MIGRATION.md.
# ============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hogoplus-backend:latest
    container_name: hogoplus-backend
    restart: always
    env_file: .env
    # Redis is a hard dependency (OTP codes, login/rate-limit state, scheduler NX
    # lock) — wait for it to be healthy so a cold `up` never races login to failure.
    depends_on:
      redis:
        condition: service_healthy
    # bind to loopback only — the public edge is nginx:443, not the container
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"     # rotate at 10MB
        max-file: "5"       # keep 5 files (~50MB total)
    volumes:
      # persist the fastembed ONNX model (~100-400MB) so it isn't re-downloaded on
      # every restart (it downloads lazily on the first RAG/embedding call).
      - fastembed_cache:/app/backend/.fastembed_cache
      # only used when FILE_STORAGE_MODE=local; harmless in s3 mode.
      - uploads:/app/backend/uploads

  # --------------------------------------------------------------------------
  # Redis — OTP codes, login/rate-limit state, and the scheduler NX lock. Defined
  # as a TRACKED service so `docker compose up -d --remove-orphans` MANAGES it
  # instead of treating a manually-run container as an orphan and deleting it
  # (which previously broke OTP + login on this host). Set in .env:
  #   REDIS_URL=redis://redis:6379/0
  # NOTE: this Redis is per-host — only use it once the Emergent backend is retired
  # (a local Redis does NOT share the scheduler NX lock / OTP / rate-limit state
  # with any other backend instance).
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hogoplus-redis
    restart: always
    # appendonly so OTP / rate-limit / NX-lock state survive a redis restart
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

volumes:
  fastembed_cache:
  uploads:
  redis_data:
